name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then echo "Repo ke root me koi .zip nahi mili"; exit 1; fi
          mkdir -p _proj
          unzip -q "$ZIP" -d _proj
          SETTINGS=$(find _proj -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle nahi mili"; exit 1; fi
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FlymeIcons-debug
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
